
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>آزمایش اتصال ایتا</title>
</head>
<body>
  <h2>آزمایش برنامک نوین‌آزمون</h2>
  <p id="status">در حال بررسی اتصال به ایتا...</p>

  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

  <script>
    const status = document.getElementById("status");

    function showStatus(message) {
      status.textContent = message;
    }

    try {
      if (window.Eitaa && window.Eitaa.WebApp) {
        const app = window.Eitaa.WebApp;
        app.ready();

        const user = app.initDataUnsafe?.user;

        if (user && user.id != null) {
          showStatus(
            "اتصال موفق است. شناسه عددی حساب: " + user.id
          );

          if (user.allows_write_to_pm === true) {
            status.textContent +=
              " — اجازه پیام خصوصی فعال است.";
          } else {
            status.textContent +=
              " — اجازه پیام خصوصی هنوز تأیید نشده است.";
          }
        } else {
          showStatus(
            "کتابخانه ایتا شناسایی شد، اما اطلاعات حساب دریافت نشد. " +
            "لطفاً برنامک را مستقیماً داخل ایتا باز کنید."
          );
        }
      } else {
        showStatus(
          "کتابخانه ایتا بارگذاری نشد. اتصال اینترنت و اجرای برنامک " +
          "در نسخه پشتیبانی‌شده ایتا را بررسی کنید."
        );
      }
    } catch (error) {
      showStatus("هنگام بررسی اتصال خطایی رخ داد.");
    }
  </script>
</body>
</html>
